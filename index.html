<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Popcorn Pending – Shared Watchlist</title>
<style>
  :root {
    --bg: #0f0f0f;
    --surface: #1c1c1e;
    --border: #2c2c2e;
    --text: #f5f5f7;
    --muted: #8e8e93;
    --orange: #ff9f0a;
    --green: #30d158;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── Header ── */
  .header {
    padding: 20px 20px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo { font-size: 28px; }
  .header-title { font-size: 18px; font-weight: 700; }
  .header-sub   { font-size: 13px; color: var(--muted); margin-top: 2px; }

  /* ── App download banner ── */
  .app-banner {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin: 16px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .app-banner .icon { font-size: 36px; flex-shrink: 0; }
  .app-banner .info { flex: 1; }
  .app-banner .info strong { display: block; font-size: 15px; }
  .app-banner .info span   { font-size: 12px; color: var(--muted); }
  .app-banner a {
    background: var(--orange);
    color: #000;
    font-weight: 700;
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 20px;
    text-decoration: none;
    white-space: nowrap;
    flex-shrink: 0;
  }

  /* ── Owner card ── */
  .owner-card {
    margin: 0 16px 12px;
    padding: 14px 16px;
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--border);
  }
  .owner-name { font-size: 18px; font-weight: 700; }
  .owner-sub  { font-size: 13px; color: var(--muted); margin-top: 4px; }

  /* ── Status tabs ── */
  .tabs {
    display: flex;
    gap: 8px;
    padding: 0 16px 12px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    color: var(--text);
  }
  .tab.active { background: var(--orange); border-color: var(--orange); color: #000; }

  /* ── Item list ── */
  .list { padding: 0 16px; }
  .item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  .item:last-child { border-bottom: none; }
  .poster {
    width: 48px;
    height: 72px;
    border-radius: 6px;
    object-fit: cover;
    background: var(--surface);
    flex-shrink: 0;
  }
  .poster-placeholder {
    width: 48px;
    height: 72px;
    border-radius: 6px;
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }
  .item-info  { flex: 1; }
  .item-title { font-size: 15px; font-weight: 600; line-height: 1.3; }
  .item-meta  { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 10px;
    margin-top: 6px;
  }
  .badge-want    { background: rgba(10,132,255,0.15); color: #0a84ff; }
  .badge-watch   { background: rgba(255,159,10,0.15); color: var(--orange); }
  .badge-watched { background: rgba(48,209,88,0.15);  color: var(--green); }

  /* ── Loading / error ── */
  .center {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }
  .center .emoji { font-size: 48px; margin-bottom: 16px; }
  .center h2 { font-size: 20px; color: var(--text); margin-bottom: 8px; }

  /* ── Footer ── */
  .footer {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    padding: 24px 20px;
  }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="logo">🍿</div>
  <div>
    <div class="header-title">Popcorn Pending</div>
    <div class="header-sub">Shared Watchlist</div>
  </div>
</div>

<!-- App download banner -->
<div class="app-banner">
  <div class="icon">📱</div>
  <div class="info">
    <strong>Get the app</strong>
    <span>Add any title to your own list</span>
  </div>
  <a href="https://apps.apple.com/app/popcorn-pending" id="app-link">Get App</a>
</div>

<!-- Dynamic content area -->
<div id="content">
  <div class="center">
    <div class="emoji">⏳</div>
    <h2>Loading list…</h2>
  </div>
</div>

<div class="footer">Powered by Popcorn Pending · jmccinc.com</div>

<script>
// ──────────────────────────────────────────────────────────────────────────
// CloudKit configuration
// ──────────────────────────────────────────────────────────────────────────
const CK_CONTAINER  = 'iCloud.com.jmccinc.PopcornPending';
const CK_ENV        = 'development';   // change to 'production' when you submit to App Store
const CK_API_TOKEN  = 'd9725e62a1a256e319343fb352deed496257ee8287c75d4c2463ae6745a83c69'; // <-- paste token from CloudKit Dashboard
const TMDB_IMG      = 'https://image.tmdb.org/t/p/w92';

// ──────────────────────────────────────────────────────────────────────────
// Get share code from URL path: /share/ABCD1234 or ?code=ABCD1234
// ──────────────────────────────────────────────────────────────────────────
function getShareCode() {
  const path = window.location.pathname;
  const parts = path.split('/').filter(Boolean);
  // /share/CODE or /CODE
  for (let i = 0; i < parts.length; i++) {
    if (parts[i] === 'share' && parts[i+1]) return parts[i+1].toUpperCase();
  }
  if (parts[parts.length - 1]) return parts[parts.length - 1].toUpperCase();
  const params = new URLSearchParams(window.location.search);
  return (params.get('code') || '').toUpperCase();
}

// ──────────────────────────────────────────────────────────────────────────
// Fetch snapshot from CloudKit public DB REST API
// ──────────────────────────────────────────────────────────────────────────
async function fetchSnapshot(code) {
  const url = `https://api.apple-cloudkit.com/database/1/${CK_CONTAINER}/${CK_ENV}/public/records/query`;
  const body = {
    query: {
      recordType: 'PublicShare',
      filterBy: [{ comparator: 'EQUALS', fieldName: 'shareCode', fieldValue: { value: code, type: 'STRING' } }]
    },
    resultsLimit: 1
  };
  const resp = await fetch(url, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'X-Apple-CloudKit-Request-KeyID': CK_API_TOKEN
    },
    body: JSON.stringify(body)
  });
  if (!resp.ok) throw new Error(`CloudKit error ${resp.status}`);
  const data = await resp.json();
  if (!data.records || data.records.length === 0) throw new Error('List not found');
  return data.records[0];
}

// ──────────────────────────────────────────────────────────────────────────
// Render
// ──────────────────────────────────────────────────────────────────────────
let allItems   = [];
let activeFilter = 'all';

function statusLabel(raw) {
  if (raw === 'watching')    return 'Watching';
  if (raw === 'watched')     return 'Watched';
  return 'Want to Watch';
}
function badgeClass(raw) {
  if (raw === 'watching') return 'badge-watch';
  if (raw === 'watched')  return 'badge-watched';
  return 'badge-want';
}

function renderItems() {
  const filtered = activeFilter === 'all'
    ? allItems
    : allItems.filter(i => i.statusRaw === activeFilter);

  if (filtered.length === 0) {
    return '<div class="center"><div class="emoji">🎬</div><h2>Nothing here</h2><p>No items in this category.</p></div>';
  }

  return '<div class="list">' + filtered.map(item => {
    const poster = item.posterPath
      ? `<img class="poster" src="${TMDB_IMG}${item.posterPath}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
      : '';
    const placeholder = `<div class="poster-placeholder" style="${item.posterPath ? 'display:none' : ''}">🎬</div>`;
    const type = item.mediaType === 'tv' ? '📺 TV Show' : '🎬 Movie';
    return `
      <div class="item">
        ${poster}
        ${placeholder}
        <div class="item-info">
          <div class="item-title">${escHtml(item.title)}</div>
          <div class="item-meta">${type}</div>
          <span class="badge ${badgeClass(item.statusRaw)}">${statusLabel(item.statusRaw)}</span>
        </div>
      </div>`;
  }).join('') + '</div>';
}

function renderPage(ownerName, items) {
  const countAll     = items.length;
  const countWant    = items.filter(i => i.statusRaw === 'wantToWatch').length;
  const countWatch   = items.filter(i => i.statusRaw === 'watching').length;
  const countWatched = items.filter(i => i.statusRaw === 'watched').length;

  document.getElementById('content').innerHTML = `
    <div class="owner-card">
      <div class="owner-name">🎬 ${escHtml(ownerName)}'s Watchlist</div>
      <div class="owner-sub">${countAll} title${countAll !== 1 ? 's' : ''}</div>
    </div>
    <div class="tabs">
      <div class="tab active" data-filter="all">All (${countAll})</div>
      <div class="tab" data-filter="wantToWatch">Want to Watch (${countWant})</div>
      <div class="tab" data-filter="watching">Watching (${countWatch})</div>
      <div class="tab" data-filter="watched">Watched (${countWatched})</div>
    </div>
    <div id="item-list"></div>
  `;

  document.getElementById('item-list').innerHTML = renderItems();

  // Tab click handlers
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      activeFilter = tab.dataset.filter;
      document.getElementById('item-list').innerHTML = renderItems();
    });
  });
}

function escHtml(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showError(msg) {
  document.getElementById('content').innerHTML = `
    <div class="center">
      <div class="emoji">😕</div>
      <h2>Couldn't Load List</h2>
      <p>${escHtml(msg)}</p>
    </div>`;
}

// ──────────────────────────────────────────────────────────────────────────
// Main
// ──────────────────────────────────────────────────────────────────────────
(async () => {
  const code = getShareCode();
  if (!code || code.length < 6) {
    showError('No share code found in this URL. Make sure you used the full link.');
    return;
  }

  if (CK_API_TOKEN === 'YOUR_CLOUDKIT_API_TOKEN_HERE') {
    showError('CloudKit API token not set up yet. The app owner needs to complete setup.');
    return;
  }

  try {
    const record    = await fetchSnapshot(code);
    const fields    = record.fields;
    const ownerName = fields.ownerName?.value || 'Someone';
    const jsonStr   = fields.shareJSON?.value  || '[]';
    allItems        = JSON.parse(jsonStr);

    // Update the app link to include the share code
    document.getElementById('app-link').href = `popcornpending://view/${code}`;

    renderPage(ownerName, allItems);
  } catch (err) {
    showError(err.message || 'Something went wrong loading this list.');
  }
})();
</script>
</body>
</html>
